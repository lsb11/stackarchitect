name: Redirect smoke test

# WHY: public/_redirects has been silently truncated twice (2026-07-02,
# 2026-07-17), 404ing every legacy URL for weeks with no signal until GSC
# reported it months later. This catches that in CI and nightly.

# This file is in both path filters so that a change to the smoke test is
# tested by the smoke test. It was not, and the PR that rewrote the deploy
# wait (3 Oct 2026) triggered no checks at all — the one change most able to
# break this workflow was the one change it could not see.
on:
  pull_request:
    paths:
      - 'public/_redirects'
      - 'functions/_middleware.js'
      - 'scripts/redirect-smoke.mjs'
      - '.github/workflows/redirect-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'public/_redirects'
      - 'functions/_middleware.js'
      - 'scripts/redirect-smoke.mjs'
      - '.github/workflows/redirect-smoke.yml'
  schedule:
    # 07:00 UTC daily — catches breakage introduced by a deploy that didn't
    # touch _redirects (e.g. a middleware change swallowing static rules).
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  lint:
    name: Static lint (no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Runs on PRs before merge. Catches truncation, chains, loops and
      # conflicting rules without hitting the network.
      - run: node scripts/redirect-smoke.mjs --parse-only

  live:
    name: Live assertions against production
    runs-on: ubuntu-latest
    # Don't run live checks on PRs from forks (no need, and avoids noise).
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Cloudflare Pages is not atomic with the push event: a build of 122
      # Astro pages with image optimisation takes minutes, not seconds. A flat
      # `sleep 45` was wrong for the whole of its life and only looked right
      # because every earlier change edited a rule whose path already resolved
      # — so the old target answered and the assertion passed against a stale
      # deploy. The first rule for a genuinely new path (/sitemap.xml, PR #45,
      # 3 Oct 2026) failed on merge for this reason and passed on a re-run
      # with nothing changed.
      #
      # Retrying the assertions is better than a longer sleep in both
      # directions: it returns the moment the deploy lands, and it keeps
      # waiting when the build is slow. On a push it is allowed ~6 minutes;
      # scheduled and manual runs assert once, since nothing is deploying.
      - name: Smoke test redirects
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" != "push" ]; then
            node scripts/redirect-smoke.mjs --concurrency 6
            exit $?
          fi
          for attempt in 1 2 3 4 5 6; do
            if node scripts/redirect-smoke.mjs --concurrency 6; then
              echo "::notice::redirect smoke passed on attempt ${attempt}"
              exit 0
            fi
            if [ "${attempt}" -lt 6 ]; then
              echo "attempt ${attempt} failed — deploy may still be propagating; retrying in 60s"
              sleep 60
            fi
          done
          echo "::error::redirect smoke still failing after 6 attempts (~6 min). This is a real failure, not deploy lag."
          exit 1
