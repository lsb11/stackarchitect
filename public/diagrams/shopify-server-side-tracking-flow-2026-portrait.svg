<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1088" role="img" aria-labelledby="t d" font-family="Inter,Segoe UI,Arial,sans-serif">
  <title id="t">Shopify server-side tracking architecture 2026, phone layout: one webhook feeding Meta CAPI and TikTok Events API, with Google Ads handled in the Google &amp; YouTube app</title>
  <desc id="d">The same data flow as the landscape diagram, stacked for a phone: a Shopify order-paid webhook fires from the store backend into one Make.com scenario, which hashes customer data and sends server-to-server events to Meta Conversions API (Purchase) and TikTok Events API (CompletePayment). For Google Ads, enhanced conversions is turned on in Shopify's Google &amp; YouTube app instead, because Shopify orders carry no Google click ID. Below, the browser-pixel path that Link Tracking Protection and ad blockers interrupt. Every label is drawn at 20 units or more so it reads at phone width.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#22c55e"/></marker>
  </defs>
  <rect width="600" height="1088" fill="#050505"/>
  <rect x="0" y="0" width="600" height="5" fill="#22c55e"/>
  <text x="40" y="56" fill="#22c55e" font-size="19" font-weight="700" letter-spacing="2">SERVER-SIDE TRACKING · $0 STACK</text>
  <text x="40" y="100" fill="#f5f5f5" font-size="31" font-weight="800">How Shopify server-side</text>
  <text x="40" y="138" fill="#f5f5f5" font-size="31" font-weight="800">tracking works (2026)</text>

  <!-- Shopify -->
  <rect x="40" y="172" width="520" height="138" rx="16" fill="#0f1512" stroke="#2f2f2f" stroke-width="2"/>
  <text x="300" y="214" fill="#f5f5f5" font-size="28" font-weight="800" text-anchor="middle">Shopify</text>
  <text x="300" y="246" fill="#a3a3a3" font-size="21" text-anchor="middle">orders/paid webhook fires from the backend</text>
  <text x="300" y="282" fill="#22c55e" font-size="20" font-weight="700" text-anchor="middle">no app install · no theme code</text>

  <line x1="300" y1="312" x2="300" y2="364" stroke="#22c55e" stroke-width="3" marker-end="url(#ah)"/>
  <text x="318" y="345" fill="#d4d4d4" font-size="20">JSON payload</text>

  <!-- Make.com -->
  <rect x="40" y="372" width="520" height="176" rx="16" fill="#0b1a12" stroke="#22c55e" stroke-width="2.5"/>
  <text x="300" y="414" fill="#f5f5f5" font-size="28" font-weight="800" text-anchor="middle">Make.com</text>
  <text x="300" y="446" fill="#a3a3a3" font-size="21" text-anchor="middle">1 scenario · free tier</text>
  <text x="300" y="480" fill="#e5e5e5" font-size="21" text-anchor="middle">SHA-256 hashes email, phone,</text>
  <text x="300" y="508" fill="#e5e5e5" font-size="21" text-anchor="middle">name, IP, UA</text>
  <text x="300" y="536" fill="#22c55e" font-size="20" font-weight="700" text-anchor="middle">about 1 credit per module per order</text>

  <!-- trunk to the three destinations -->
  <line x1="70" y1="550" x2="70" y2="866" stroke="#22c55e" stroke-width="3"/>
  <line x1="70" y1="638" x2="104" y2="638" stroke="#22c55e" stroke-width="3" marker-end="url(#ah)"/>
  <line x1="70" y1="752" x2="104" y2="752" stroke="#22c55e" stroke-width="3" marker-end="url(#ah)"/>
  <line x1="70" y1="866" x2="104" y2="866" stroke="#22c55e" stroke-width="3" marker-end="url(#ah)"/>

  <rect x="110" y="588" width="450" height="100" rx="14" fill="#0f1512" stroke="#2f2f2f" stroke-width="2"/>
  <text x="134" y="628" fill="#f5f5f5" font-size="24" font-weight="800">Meta Conversions API</text>
  <text x="134" y="662" fill="#a3a3a3" font-size="20">Purchase event · full match keys</text>

  <rect x="110" y="702" width="450" height="100" rx="14" fill="#0f1512" stroke="#2f2f2f" stroke-width="2"/>
  <text x="134" y="742" fill="#f5f5f5" font-size="22" font-weight="800">Google Ads: Google &amp; YouTube app</text>
  <text x="134" y="776" fill="#a3a3a3" font-size="20">turn on enhanced conversions there</text>

  <rect x="110" y="816" width="450" height="100" rx="14" fill="#0f1512" stroke="#2f2f2f" stroke-width="2"/>
  <text x="134" y="856" fill="#f5f5f5" font-size="24" font-weight="800">TikTok Events API</text>
  <text x="134" y="890" fill="#a3a3a3" font-size="20">CompletePayment · Advanced Matching</text>

  <!-- the old path -->
  <rect x="40" y="944" width="520" height="126" rx="14" fill="#170a0a" stroke="#7f1d1d" stroke-width="2"/>
  <text x="62" y="978" fill="#f87171" font-size="20" font-weight="800">✕ THE OLD BROWSER-PIXEL PATH</text>
  <text x="62" y="1008" fill="#d4d4d4" font-size="19">iOS 17+ Link Tracking Protection strips click</text>
  <text x="62" y="1032" fill="#d4d4d4" font-size="19">IDs in Mail and Messages; ad blockers stop the</text>
  <text x="62" y="1054" fill="#d4d4d4" font-size="19">pixel. We publish no loss figure.</text>
</svg>
